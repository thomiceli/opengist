{{ define "content" }}
<div class="space-y-6">
    {{ template "gist_header" . }}

    <h2 class="text-xl font-bold leading-tight">{{ .locale.Tr "gist.comments" }}</h2>

    {{ if ne (len .comments) 0 }}
        <div class="space-y-4">
            {{ template "gist_comment_list" . }}
        </div>
        {{ template "pagination" . }}
    {{ else }}
        <div class="text-muted-foreground flex flex-col items-center justify-center py-16 text-center">
            <svg class="size-12" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <h3 class="text-foreground mt-3 text-sm font-medium">{{ .locale.Tr "gist.comments.no" }}</h3>
        </div>
    {{ end }}
</div>
{{ end }}
